name: Welcome first-time contributors

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    steps:
      - name: Welcome on first issue or pull request
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue in **ByteC**!

            We appreciate your interest in the project. Please provide any additional details requested by the issue template so we can investigate it.
          pr-message: |
            🎉 Thanks for your first pull request to **ByteC**!

            We appreciate your contribution. The maintainers will review your changes when they can. Please make sure the relevant tests pass and the documentation is updated when needed.
