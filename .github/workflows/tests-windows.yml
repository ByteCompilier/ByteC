name: ByteC Windows Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bytec-windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Build and test on Windows x64 (MinGW)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Show toolchain versions
        shell: msys2 {0}
        run: |
          gcc --version
          mingw32-make --version
          cmake --version

      - name: Configure ByteC
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build ByteC executable
        shell: msys2 {0}
        run: cmake --build build --target ByteC

      - name: Run ByteC tests
        shell: cmd
        run: python tests\run_tests.py build\ByteC.exe
